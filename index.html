<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge Fitness | Train With Purpose</title>
    <link rel="stylesheet" href="index.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class=" font-[Poppins,sans-serif] text-stone-950 justify-center ">
        <header class="bg-gray-950 w-full relative inset-x-0 top-0 z-20 text-white h-auto min-h-[10vh]">
            <nav class="flex flex-col md:flex-row justify-between items-center min-h-[10vh] px-5 py-4 gap-5">
                <a href="#home" class="text-xl font-extrabold tracking-tight cursor-pointer">FORGE<span class="text-orange-600">.</span></a>
                <ul class="hidden items-center gap-8 text-l font-bold font-poppins text-stone-600 md:flex">
                    <li><a class="px-3 py-1 rounded-[10px] border-2 border-transparent hover:border-white text-white transition-all" href="#home">Home</a></li>
                    <li><a class="px-3 py-1 rounded-[10px] border-2 border-transparent hover:border-white text-white transition-all" href="#classes">Classes</a></li>
                    <li><a class="px-3 py-1 rounded-[10px] border-2 border-transparent hover:border-white text-white transition-all" href="#membership">Membership</a></li>
                    <li><a class="px-3 py-1 rounded-[10px] border-2 border-transparent hover:border-white text-white transition-all" href="#trainers">Trainers</a></li>
                </ul>
                <a href="#contact" class="rounded-lg bg-orange-600 px-4 py-2.5 text-sm font-bold text-white transition hover:bg-orange-700 focus:outline-none focus:ring-2 focus:ring-orange-600 focus:ring-offset-2">Contact us</a>
            </nav>
        </header>

        <main id="home" class="mx-auto grid w-full max-w-7xl items-center gap-12 px-5 py-12 sm:px-8 sm:py-16 lg:grid-cols-[0.9fr_1.1fr] lg:gap-20 lg:px-12 lg:py-24">
            <section class="max-w-xl">
                <p class="mb-5 text-sm font-[600px] uppercase tracking-[0.25em] text-xl font-poppins text-orange-600">Train with purpose</p>
                <h1 class="text-4xl font-extrabold leading-[1.08] tracking-tight sm:text-5xl lg:text-6xl">Join our community and get fit today.</h1>
                <p class="mt-6 max-w-md text-base leading-7 text-stone-600 sm:text-lg">Embark on a path towards a healthier, stronger, and fitter you with coaching and classes built around your goals.</p>
                <div class="mt-9 flex flex-col gap-3 sm:flex-row">
                    <a href="#contact" class="inline-flex items-center justify-center rounded-lg bg-orange-600 px-6 py-3 text-sm font-bold text-white transition hover:bg-orange-700 focus:outline-none focus:ring-2 focus:ring-orange-600 focus:ring-offset-2">Contact us</a>
                    <a href="#classes" class="inline-flex items-center justify-center rounded-lg border-2 border-orange-600 px-6 py-3 text-sm font-bold text-orange-600 transition hover:bg-orange-50 focus:outline-none focus:ring-2 focus:ring-orange-600 focus:ring-offset-2">Join classes</a>
                </div>
            </section>

            <section class="grid grid-cols-2 items-center gap-3 sm:gap-5" aria-label="Gym training gallery">
                <div class="space-y-3 sm:space-y-5">
                    <img class="h-44 w-full rounded-2xl object-cover shadow-lg sm:h-64 lg:h-72" src="./assets/images/th.jpg" alt="Athlete training in the gym">
                    <img class="h-52 w-full rounded-2xl object-cover shadow-lg sm:h-80 lg:h-96" src="./assets/images/OIP.jpg" alt="Strength training equipment">
                </div>
                <div class="space-y-3 sm:space-y-5">
                    <img class="mx-auto aspect-square w-3/4 rounded-full object-cover shadow-lg" src="./assets/images/OIP (1).jpg" alt="Personal training session">
                    <img class="h-52 w-full rounded-2xl object-cover shadow-lg sm:h-80 lg:h-96" src="./assets/images/download.jpg" alt="Gym workout area">
                </div>
            </section>
        </main>
        <script src="index.js"></script>
    </body>
</html>
